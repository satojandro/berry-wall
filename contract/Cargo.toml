[package]
name = "pixel-board"
version = "0.1.0"
edition = "2021"
publish = false
description = "Modern Berry Club: shared pixel wall with paint, farming yield and versioned chunk sync."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.29.1", features = ["unit-testing", "legacy"] }
borsh = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
debug = false
panic = "abort"
overflow-checks = true
codegen-units = 1
strip = true
